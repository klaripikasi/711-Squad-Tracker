<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>711 Sport Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="glass-panel rounded-2xl p-6 text-center border-t-4 border-t-emerald-500 shadow-lg">
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">🔥 711 Sport Tracker</h1>
            <p class="text-slate-400 text-sm md:text-base">Siklus: Kamis - Rabu | Lari 12KM = 90 Pts</p>
            <p id="cycleDisplay" class="text-emerald-400 font-semibold mt-2 text-sm bg-emerald-900/30 inline-block px-3 py-1 rounded-full"></p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- KOLOM KIRI: Input Form & All-Time Ranking -->
            <div class="space-y-6">
                <!-- Form Input -->
                <div class="glass-panel rounded-2xl p-6">
                    <h2 class="text-xl font-bold text-white border-b border-slate-700 pb-3 mb-4">➕ Catat Aktivitas</h2>
                    <form id="sportForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-300 mb-1">Nama</label>
                            <select id="inputNama" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2.5 text-white" required>
                                <option value="">-- Pilih Nama --</option>
                                <option value="Arif">Arif</option>
                                <option value="Meng">Meng</option>
                                <option value="Dhavi">Dhavi</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-300 mb-1">Tanggal</label>
                            <input type="date" id="inputTanggal" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2.5 text-white" required>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-300 mb-1">Jenis Olahraga</label>
                            <select id="inputJenis" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2.5 text-white" required>
                                <option value="Lari">Lari</option>
                                <option value="Tenis Meja">Tenis Meja</option>
                                <option value="Badminton">Badminton</option>
                                <option value="Voli">Voli</option>
                                <option value="Renang">Renang</option>
                                <option value="Angkat Beban">Angkat Beban</option>
                                <option value="Push Up">Push Up</option>
                                <option value="Sit Up">Sit Up</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                        <div id="fieldJarak">
                            <label class="block text-sm font-semibold text-slate-300 mb-1">Jarak (KM)</label>
                            <input type="number" id="inputJarak" step="0.1" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2.5 text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-emerald-300 mb-1">Durasi Olahraga (Menit)</label>
                            <input type="number" id="inputDurasi" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2.5 text-white" placeholder="Contoh: 45" required>
                        </div>
                        <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200 mt-4 shadow-lg shadow-emerald-600/30">
                            🚀 Simpan Data
                        </button>
                        <p id="statusMsg" class="text-sm text-center font-semibold mt-2"></p>
                    </form>
                </div>

                <!-- Ranking Keseluruhan -->
                <div class="glass-panel rounded-2xl p-6 border-l-4 border-l-purple-500">
                    <h2 class="text-xl font-bold text-white border-b border-slate-700 pb-3 mb-4">👑 Ranking All-Time</h2>
                    <div id="allTimeContainer" class="space-y-3">
                        <p class="text-slate-400 italic text-sm">Memuat ranking...</p>
                    </div>
                </div>
            </div>

            <!-- KOLOM KANAN: Dashboard Minggu Ini & Tren -->
            <div class="lg:col-span-2 space-y-6">
                
                <!-- Target Minggu Ini -->
                <div class="glass-panel rounded-2xl p-6">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-5">
                        <h2 class="text-xl font-bold text-white">🎯 Target Minggu Ini</h2>
                        <button onclick="fetchData()" class="text-xs bg-slate-700 hover:bg-slate-600 text-white py-1.5 px-3 rounded-md transition">🔄 Refresh</button>
                    </div>
                    
                    <div id="currentWeekContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <p class="text-slate-400 italic">Memuat data minggu ini...</p>
                    </div>

                    <!-- Grafik Bar Lari Mingguan -->
                    <div class="mt-6 pt-4 border-t border-slate-700">
                        <h3 class="text-sm font-bold text-slate-300 mb-4 uppercase tracking-wider text-center">📊 Grafik Progress Lari (Target 12 KM)</h3>
                        <div class="w-full h-48">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Tren 6 Minggu Terakhir -->
                <div class="glass-panel rounded-2xl p-6">
                    <h2 class="text-xl font-bold text-white border-b border-slate-700 pb-3 mb-5">📈 Tren 6 Minggu Terakhir</h2>
                    <div class="w-full h-64">
                        <canvas id="trendChart"></canvas>
                    </div>
                    <div id="championHistory" class="mt-4 flex gap-2 overflow-x-auto hide-scrollbar pb-2"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwgNvQJnK6JeqRdKUYGax9X0676f9EZrwb34FnDRf0j3cVdj0AMP6Hr3XnNxSWn2Q0e/exec"; 
        
        let lineChartInstance = null;
        let barChartInstance = null;
        const PLAYERS = ["Arif", "Meng", "Dhavi"]; 

        document.getElementById('inputTanggal').valueAsDate = new Date();
        document.getElementById('inputJenis').addEventListener('change', function(e) {
            document.getElementById('fieldJarak').style.display = (e.target.value === 'Lari') ? 'block' : 'none';
            if(e.target.value !== 'Lari') document.getElementById('inputJarak').value = '';
        });

        // Menentukan Siklus
        function getCycleEnd(dateString) {
            let d = new Date(dateString);
            let day = d.getDay(); 
            let diff = (3 - day + 7) % 7;
            d.setDate(d.getDate() + diff);
            return d.toISOString().split('T')[0]; 
        }

        const currentCycleEnd = getCycleEnd(new Date());
        let cycleStart = new Date(currentCycleEnd); cycleStart.setDate(cycleStart.getDate() - 6);
        document.getElementById('cycleDisplay').innerText = `Minggu Berjalan: ${cycleStart.toLocaleDateString('id-ID')} s/d ${new Date(currentCycleEnd).toLocaleDateString('id-ID')}`;

        // Form Submit
        document.getElementById('sportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            const status = document.getElementById('statusMsg');

            btn.innerText = "⏳ Menyimpan..."; btn.disabled = true;

            const payload = {
                nama: document.getElementById('inputNama').value,
                tanggal: document.getElementById('inputTanggal').value,
                olahraga: document.getElementById('inputJenis').value,
                jarak: document.getElementById('inputJarak').value || 0,
                durasi: document.getElementById('inputDurasi').value || 0 // Input Durasi
            };

            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                status.innerText = "✅ Berhasil dicatat!";
                status.className = "text-sm text-center font-semibold mt-2 text-emerald-400";
                
                document.getElementById('inputJenis').value = 'Lari';
                document.getElementById('inputJarak').value = '';
                document.getElementById('inputDurasi').value = '';
                document.getElementById('fieldJarak').style.display = 'block';
                
                setTimeout(() => { status.innerText = ""; fetchData(); }, 1500);
            } catch (error) {
                status.innerText = "❌ Gagal menyimpan.";
                status.className = "text-sm text-center font-semibold mt-2 text-red-400";
            } finally {
                btn.innerText = "🚀 Simpan Data"; btn.disabled = false;
            }
        });

        function calculateScore(km, activitiesCount) {
            let extraScore = activitiesCount * 0.5;
            if (km >= 12) return 90 + (km - 12) + extraScore;
            return extraScore; 
        }

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                processData(data);
            } catch (error) {
                console.error("Gagal load data", error);
            }
        }

        function processData(data) {
            let cyclesData = {};
            let allTimeScores = { "Arif": 0, "Meng": 0, "Dhavi": 0 };

            data.forEach(row => {
                let rowDate = new Date(row['Tanggal']).toISOString().split('T')[0];
                let cycleId = getCycleEnd(rowDate);
                let nama = row['Nama'];
                let durasi = parseFloat(row['Durasi']) || 0; 
                
                if (!cyclesData[cycleId]) {
                    cyclesData[cycleId] = {};
                    PLAYERS.forEach(p => cyclesData[cycleId][p] = { km: 0, actSet: new Set(), activitiesLog: [], durasiTotal: 0 });
                }
                
                if (cyclesData[cycleId][nama]) {
                    cyclesData[cycleId][nama].durasiTotal += durasi;

                    if (row['Olahraga'] === 'Lari') {
                        cyclesData[cycleId][nama].km += parseFloat(row['Jarak']);
                        cyclesData[cycleId][nama].activitiesLog.push(`Lari ${row['Jarak']}km`);
                    } else {
                        cyclesData[cycleId][nama].actSet.add(rowDate + "-" + row['Olahraga']);
                        cyclesData[cycleId][nama].activitiesLog.push(row['Olahraga']);
                    }
                }
            });

            let processedCycles = {};
            Object.keys(cyclesData).forEach(cycleId => {
                processedCycles[cycleId] = {};
                PLAYERS.forEach(nama => {
                    let pData = cyclesData[cycleId][nama];
                    let score = calculateScore(pData.km, pData.actSet.size);
                    processedCycles[cycleId][nama] = {
                        km: pData.km,
                        score: score,
                        logs: pData.activitiesLog,
                        durasiTotal: pData.durasiTotal
                    };
                    allTimeScores[nama] += score;
                });
            });

            renderCurrentWeek(processedCycles[currentCycleEnd]);
            renderBarChart(processedCycles[currentCycleEnd]);
            renderAllTime(allTimeScores);
            renderTrendChart(processedCycles);
        }

        function renderCurrentWeek(weekData) {
            const container = document.getElementById('currentWeekContainer');
            container.innerHTML = '';
            
            if (!weekData) {
                container.innerHTML = '<p class="text-slate-400">Belum ada data minggu ini.</p>';
                return;
            }

            let sorted = PLAYERS.map(nama => ({ nama, ...weekData[nama] })).sort((a,b) => b.score - a.score);

            sorted.forEach((p, idx) => {
                let progress = Math.min((p.km / 12) * 100, 100);
                // Logika persentase jika kurang dari 12km
                let targetText = p.km >= 12 ? '<span class="text-emerald-400">✅ Tercapai</span>' : `<span class="text-amber-400">⏳ ${progress.toFixed(1)}%</span>`;
                let targetColor = p.km >= 12 ? 'bg-emerald-500' : 'bg-amber-500';
                
                let logsHTML = p.logs.slice(-3).map(l => `<span class="bg-slate-700 text-[10px] px-2 py-1 rounded">${l}</span>`).join('');
                
                // Konversi durasi ke Jam & Menit jika lebih dari 60 menit
                let jam = Math.floor(p.durasiTotal / 60);
                let menit = p.durasiTotal % 60;
                let formatWaktu = jam > 0 ? `${jam}j ${menit}m` : `${menit}m`;

                container.innerHTML += `
                    <div class="bg-slate-800/80 rounded-xl p-4 border ${idx === 0 && p.score > 0 ? 'border-amber-500 shadow-md shadow-amber-500/20' : 'border-slate-700'} relative overflow-hidden">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-white text-lg">${idx === 0 && p.score > 0 ? '👑 ' : ''}${p.nama}</h3>
                            <span class="text-2xl font-black text-white">${p.score.toFixed(1)} <span class="text-sm font-normal text-slate-400">pts</span></span>
                        </div>
                        
                        <div class="mb-1 flex justify-between text-xs text-slate-300">
                            <span>🏃 Lari (${p.km.toFixed(1)}/12 KM)</span>
                            <span class="font-bold">${targetText}</span>
                        </div>
                        <div class="w-full bg-slate-900 rounded-full h-2 mb-3">
                            <div class="${targetColor} h-2 rounded-full" style="width: ${progress}%"></div>
                        </div>

                        <!-- Info Durasi Waktu Total -->
                        <div class="flex items-center text-xs text-emerald-300 bg-emerald-900/30 px-2 py-1 rounded w-fit mb-3">
                            ⏱️ Total Waktu: <strong class="ml-1">${formatWaktu}</strong>
                        </div>

                        <div class="flex flex-wrap gap-1">
                            ${logsHTML || '<span class="text-xs text-slate-500">Belum ada aktivitas</span>'}
                            ${p.logs.length > 3 ? `<span class="bg-slate-700 text-[10px] px-2 py-1 rounded">+${p.logs.length - 3}</span>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function renderBarChart(weekData) {
            const ctx = document.getElementById('barChart').getContext('2d');
            if (barChartInstance) barChartInstance.destroy();

            let dataKMs = PLAYERS.map(nama => weekData ? weekData[nama].km : 0);
            let bgColors = dataKMs.map(km => km >= 12 ? '#10b981' : '#3b82f6'); // Hijau jika capai target, biru jika belum

            barChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: PLAYERS,
                    datasets: [{
                        label: 'Jarak Lari (KM)',
                        data: dataKMs,
                        backgroundColor: bgColors,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            max: Math.max(15, ...dataKMs), // Garis maksimal chart
                            grid: { color: '#334155' }, 
                            ticks: { color: '#94a3b8' } 
                        },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8', font: {weight: 'bold'} } }
                    },
                    plugins: {
                        legend: { display: false },
                        annotation: {
                            // Menambahkan Garis Target 12KM (opsional visual, ChartJS butuh plugin terpisah, jadi kita gunakan cara ini)
                        }
                    }
                },
                // Plugin custom untuk menggambar garis target 12 KM
                plugins: [{
                    id: 'targetLine',
                    afterDraw: chart => {
                        let ctx = chart.ctx;
                        let yAxis = chart.scales.y;
                        let xAxis = chart.scales.x;
                        let yPixel = yAxis.getPixelForValue(12);

                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(xAxis.left, yPixel);
                        ctx.lineTo(xAxis.right, yPixel);
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = '#ef4444'; // Warna garis merah
                        ctx.setLineDash([5, 5]);
                        ctx.stroke();

                        ctx.fillStyle = '#ef4444';
                        ctx.fillText('🎯 Target 12 KM', xAxis.right - 85, yPixel - 8);
                        ctx.restore();
                    }
                }]
            });
        }

        function renderAllTime(scores) {
            const container = document.getElementById('allTimeContainer');
            let sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
            
            container.innerHTML = sorted.map((p, i) => `
                <div class="flex justify-between items-center bg-slate-800 p-3 rounded-lg border border-slate-700">
                    <span class="text-white font-semibold"><span class="text-slate-400 w-4 inline-block">${i+1}.</span> ${p[0]}</span>
                    <span class="text-purple-400 font-bold">${p[1].toFixed(1)} <span class="text-xs text-slate-500">pts</span></span>
                </div>
            `).join('');
        }

        function renderTrendChart(processedCycles) {
            let sortedCycles = Object.keys(processedCycles).sort().slice(-6);
            let labels = sortedCycles.map(d => new Date(d).toLocaleDateString('id-ID', {day: 'numeric', month: 'short'}));
            let datasets = PLAYERS.map((nama, idx) => {
                const colors = ['#10b981', '#3b82f6', '#f59e0b']; 
                return {
                    label: nama,
                    data: sortedCycles.map(cId => processedCycles[cId][nama]?.score || 0),
                    borderColor: colors[idx], backgroundColor: colors[idx],
                    tension: 0.3, borderWidth: 2
                };
            });

            const ctx = document.getElementById('trendChart').getContext('2d');
            if (lineChartInstance) lineChartInstance.destroy();
            
            lineChartInstance = new Chart(ctx, {
                type: 'line', data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    },
                    plugins: { legend: { labels: { color: '#f8fafc' } } }
                }
            });

            const champContainer = document.getElementById('championHistory');
            champContainer.innerHTML = sortedCycles.map(cId => {
                let weekDate = new Date(cId).toLocaleDateString('id-ID', {day: 'numeric', month: 'short'});
                let winner = PLAYERS.reduce((max, p) => (processedCycles[cId][p].score > max.score ? {nama: p, score: processedCycles[cId][p].score} : max), {nama: '-', score: 0});
                if(winner.score === 0) return '';
                return `
                    <div class="bg-slate-800 border border-slate-700 min-w-[100px] p-2 rounded-lg text-center flex-shrink-0">
                        <p class="text-[10px] text-slate-400 mb-1">${weekDate}</p>
                        <p class="text-sm font-bold text-amber-500">🏆 ${winner.nama}</p>
                    </div>
                `;
            }).reverse().join(''); 
        }

        // Auto-load data saat pertama buka web
        fetchData();
    </script>
</body>
</html>
